<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connexion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <main class="container">
    <section class="card">
      <div class="brand">
        <img src="{{ url_for('static', filename='logo.png') }}" width="48" alt="logo">
        <div>
          <div class="muted">Bienvenue</div>
          <div class="muted" style="font-size:12px">Veuillez vous identifier</div>
        </div>
      </div>

      <h2>Connexion</h2>

      <form method="POST">
        <input class="input" type="text" name="username" placeholder="Identifiant" required>
        <input class="input" type="password" name="password" placeholder="Mot de passe" required>

        <div class="actions">
          <button type="reset">Reset</button>
          <button type="submit">Valider</button>
        </div>
      </form>

      <div style="margin-top:12px">
        <a href="{{ url_for('register') }}">Créer un compte</a>
      </div>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <!-- A7: L'auto-escaping est activé par défaut dans Jinja2 -->
      <p class="alert alert-{{ category }}">{{ message|e }}</p>
    {% endfor %}
  {% endif %}
{% endwith %}


    </section>
  </main>

</body>

</html>
