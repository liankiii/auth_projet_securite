<!DOCTYPE html>
<html>
<head>
    <title>Panneau Admin</title>
</head>
<body>

<h2>Panneau d'Administration</h2>

<h3>Actions disponibles :</h3>

<form method="POST" action="{{ url_for('admin_reset') }}">
    <button type="submit" onclick="return confirm('Êtes-vous sûr ? Cette action supprimera tous les utilisateurs.')">
        Réinitialiser tous les utilisateurs
    </button>
</form>

<hr>

<h3>Supprimer un utilisateur</h3>
<form method="POST" action="{{ url_for('admin_delete') }}">
    <input type="text" name="username" placeholder="Identifiant" required>
    <button type="submit" onclick="return confirm('Êtes-vous sûr ?')">
        Supprimer
    </button>
</form>

<hr>
<a href="{{ url_for('logout') }}">Retour</a>

</body>
</html>
