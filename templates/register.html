<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Créer un compte</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="container">
        <section class="card">
            <h2>Créer un compte</h2>

            <form method="POST">
                <input class="input" type="text" name="username" placeholder="Identifiant" required minlength="3">
                <input class="input" type="password" name="password" placeholder="Mot de passe" required minlength="12">
                <small>Minimum 12 caractères pour la sécurité</small>

                <div class="actions">
                    <button type="submit">Créer</button>
                </div>
            </form>

            <div style="margin-top:12px">
                <a href="{{ url_for('login') }}">Retour</a>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <!-- A7: Protection XSS -->
                  <p class="alert alert-{{ category }}">{{ message|e }}</p>
                {% endfor %}
              {% endif %}
            {% endwith %}
        </section>
    </main>
</body>

</html>
